name: Create New Github Team Approval
on:
  issue_comment:
    types:
     - created
     - edited
  workflow_dispatch:
    inputs:
      team:
        description: "Github Team"
        required: true
        type: string
      permission:
        type: choice
        description: "Provide which permission"
        options:
         - pull
         - push
jobs:
  create_github_team:
    if: (contains(github.event.issue.labels.*.name, 'create_team') && contains(github.event.comment.body, '/approve')) || github.event_name == 'workflow_dispatch'
    name: Create New Github team
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: develop
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
      - uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/CREATE-NEW-TEAM.yml
      - name: echo inputs
        shell: bash
        env: 
          TEAM: ${{ steps.issue-parser.outputs.issueparser_team }}
          PERMISSION: ${{ steps.issue-parser.outputs.issueparser_permission }}
          TEAM_WORKFLOW_DISPATCH: ${{ inputs.team }}
          PERMISSION_WORKFLOW_DISPATCH: ${{ inputs.permission }}
        run: |
           if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
             echo "TEAM=$TEAM" >> $GITHUB_ENV
             echo "PERMISSION=$PERMISSION" >> $GITHUB_ENV
           else
             echo "TEAM=$TEAM_WORKFLOW_DISPATCH" >> $GITHUB_ENV
             echo "PERMISSION=$PERMISSION_WORKFLOW_DISPATCH" >> $GITHUB_ENV
           fi
      - name: Get commenter's permission
        if: github.event_name == 'issue_comment'
        id: check-permission
        env:
         GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
         COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          check_permission=$(curl -s -H \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/susanto-dev/devops-infra/collaborators/$COMMENTER/permission | jq -r '.permission' )
          echo "$permission"
          if [[ "$check_permission" == "admin" ]];then
            echo "ADMIN=true" >> $GITHUB_ENV
          else
            echo "ADMIN=false" >> $GITHUB_ENV
          fi
      - uses: actions/github-script@v7
        if: github.event_name == 'issue_comment' && env.ADMIN == 'false'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'You have insufficient permission to create repository'
            })

      - name: Create New Github TEAM
        if: (github.event_name == 'issue_comment' && env.ADMIN == 'true' ) || (github.event_name == 'workflow_dispatch')
        shell: bash
        env:
         GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          HTTP_RESPONSE=$(curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/orgs/susanto-dev/teams \
          -d '{
            "name": "'"$TEAM"'",
            "permission": "'"$PERMISSION"'",
            "privacy": "closed"
           }')
          echo "$HTTP_RESPONSE"

      - uses: actions/github-script@v7
        if: github.event_name == 'issue_comment' && env.ADMIN == 'true'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✨New github team has been created'
            })
            github.rest.issues.update({
             ...context.repo,
             issue_number: context.issue.number,
             state: "closed"
            })

